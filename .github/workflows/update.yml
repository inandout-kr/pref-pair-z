name: update

on:
  schedule:
    - cron: "40 7 * * 1-5" # 평일 16:40 KST (장 마감 후)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write # data/prices.csv 커밋 (60일 무활동 시 예약 실행이 꺼지는 것도 막음)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python build.py site
      - name: Commit prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.csv
          git diff --cached --quiet || (git commit -m "data: $(TZ=Asia/Seoul date +%F) 종가" && git push)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
